projects:
  - libvirt-ruby
  - https://gitlab.com/libvirt/libvirt/-/raw/master/ci/lcitool/projects/libvirt+dist.yml

gitlab:
  namespace: libvirt
  project: libvirt-ruby

targets:

  almalinux-9: x86_64

  almalinux-10:
    projects:
      - libvirt-ruby
      - https://gitlab.com/libvirt/libvirt/-/raw/master/ci/lcitool/projects/libvirt+minimal.yml
      - https://gitlab.com/libvirt/libvirt/-/raw/master/ci/lcitool/projects/libvirt+dist.yml

    jobs:
      - arch: x86_64
      - arch: x86_64
        template: .native_git_build_job
        suffix: -git

  alpine-322: x86_64

  alpine-323: x86_64

  alpine-edge: x86_64

  centos-stream-9: x86_64

  centos-stream-10: x86_64

  debian-12: x86_64

  debian-13: x86_64

  debian-sid: x86_64

  fedora-43: x86_64

  fedora-44: x86_64

  fedora-rawhide: x86_64

  opensuse-leap-15:
    jobs:
      - arch: x86_64
        variables:
          DIST: skip
          RPM: skip

  opensuse-tumbleweed:
    jobs:
      - arch: x86_64
        variables:
          DIST: skip
          RPM: skip

  ubuntu-2404: x86_64

  ubuntu-2604: x86_64
